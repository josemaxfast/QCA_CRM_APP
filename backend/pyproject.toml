[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-backend"
version = "0.1.0"
description = "QCA CRM API"
requires-python = ">=3.11"
# All dependencies are permissively licensed (MIT/BSD/Apache). No GPL, AGPL or LGPL.
dependencies = [
    "fastapi>=0.115",          # MIT
    "uvicorn[standard]>=0.30", # BSD
    "sqlalchemy>=2.0",         # MIT
    "pg8000>=1.31",            # BSD-3 (pure-Python PostgreSQL driver; psycopg is LGPL)
    "alembic>=1.13",           # MIT
    "pydantic-settings>=2.4",  # MIT
    "pyjwt[crypto]>=2.9",      # MIT
    "httpx>=0.27",             # BSD
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
